# IT-001: Enterprise CI/CD pipeline for VitalFlow HMS.
#
# This workflow runs on every push and pull request, executing:
#   - Rust formatting check (cargo fmt)
#   - Rust linting (cargo clippy -D warnings)
#   - Rust unit tests (cargo test --lib)
#   - Rust integration tests (cargo test --test *)
#   - Frontend tests (vitest)
#   - Frontend linting (eslint)
#   - Frontend type checking (tsc)
#   - Frontend build (vite build)
#   - Coverage measurement (cargo-llvm-cov + vitest --coverage)
#   - Artifact upload (test results + coverage reports)
#
# The integration tests require a PostgreSQL test database, provisioned
# via a service container.

name: VitalFlow HMS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://hms_test:hms_test@localhost:5432/hms_test

jobs:
  # ── Rust: Format + Lint + Unit Tests ──────────────────────────────────────
  rust-quality:
    name: Rust Format + Clippy + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # QA-2026-09-08 C3: the test targets (tests/*.rs) import the crate's
        # private modules, which are only exported under the
        # `hms-integration-tests` feature (see src/lib.rs module gating).
        # Without it, `--all-targets` fails to compile session_tests and the
        # rust-quality job has been red / skipped-in-practice.
        #
        # The LIB is held to -D warnings (zero tolerance). The test targets
        # still carry ~12 pre-existing `field_reassign_with_default` style
        # lints in config_tests.rs / common/mod.rs (predates this workflow
        # change; cosmetic, test-only) — allowed via -A for now so the gate
        # runs instead of being ignored. Clean them up, then drop the -A.
        run: >
          cargo clippy --all-targets --features hms-integration-tests --
          -D warnings
          -A clippy::field_reassign_with_default

      - name: Run unit tests (no DB required)
        run: cargo test --lib --features hms-integration-tests

  # ── Rust: Dependency vulnerability audit ────────────────────────────────────
  # QA-2026-09-08 (3.2-10, was ❌): docs/04 marked cargo/npm audit as
  # "Planned Batch 5" — nothing gated known-CVE dependencies. This FAILS
  # the build on any advisory. If a dependency needs a documented
  # exception, add the advisory ID to an ignore list here with a
  # justification comment.
  rust-audit:
    name: Rust Dependency Audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies (app)
        working-directory: src-tauri
        run: cargo audit --deny warnings

      - name: Audit Rust dependencies (keygen)
        working-directory: keygen
        run: cargo audit --deny warnings

  # ── Rust: Integration Tests (requires PostgreSQL) ─────────────────────────
  rust-integration:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hms_test
          POSTGRES_PASSWORD: hms_test
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Run integration tests
        # QA-2026-09-08 C3: previously only the 4 legacy suites ran — the
        # 13 newer AERP suites (session security, WhatsApp authz, billing,
        # backup, config, accounts, lab, nursing, queue, reports, search,
        # notifications, ipc_posture) read HMS_TEST_DB_URL (never set in
        # CI) and the feature gate was missing, so they NEVER executed in
        # CI despite passing locally. Bare `--tests` builds and runs every
        # suite in tests/ (do NOT list suite names after `--` — that is a
        # test-name FILTER, not suite selection, and would match nothing).
        # Set both env vars: legacy suites read DATABASE_URL, AERP suites
        # read HMS_TEST_DB_URL. --test-threads=1 matches the project's own
        # sequential battery (REVIEW-PACKAGE-P3.md): suites share one
        # scratch DB and some fixtures rely on execution order.
        run: cargo test --features hms-integration-tests --tests -- --test-threads=1
        env:
          DATABASE_URL: postgresql://hms_test:hms_test@localhost:5432/hms_test
          HMS_TEST_DB_URL: postgresql://hms_test:hms_test@localhost:5432/postgres

  # ── Rust: Coverage ──────────────────────────────────────────────────────────
  rust-coverage:
    name: Rust Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hms_test
          POSTGRES_PASSWORD: hms_test
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov --features hms-integration-tests --workspace --lcov --output-path lcov.info
        env:
          DATABASE_URL: postgresql://hms_test:hms_test@localhost:5432/hms_test
          HMS_TEST_DB_URL: postgresql://hms_test:hms_test@localhost:5432/postgres

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: src-tauri/lcov.info

  # ── Frontend: Lint + Type Check + Test + Build ──────────────────────────────
  frontend-quality:
    name: Frontend Lint + Type Check + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test with coverage
        run: npx vitest run --coverage
        env:
          CI: true

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

      - name: Build
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Summary job for branch protection ───────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [rust-quality, rust-audit, rust-integration, rust-coverage, frontend-quality]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.rust-quality.result }}" != "success" ] || \
             [ "${{ needs.rust-integration.result }}" != "success" ] || \
             [ "${{ needs.rust-coverage.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
