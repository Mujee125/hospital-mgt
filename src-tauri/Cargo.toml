[package]
name = "hospital-mgmt"
version = "0.1.0"
description = "Hospital Management System"
authors = ["you"]
edition = "2021"
default-run = "hospital-mgmt"

[lib]
name = "hospital_mgmt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Server build: bundles + provisions real PostgreSQL as a Windows Service.
# Build with: cargo build --features server-build
server-build = []
# Client build: no PostgreSQL at all, connects to a configured server IP.
# Build with: cargo build --features client-build
client-build = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sqlx         = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "uuid", "rust_decimal", "json"] }
rust_decimal = { version = "1", features = ["serde-with-float"] }
chrono       = { version = "0.4", features = ["serde"] }
tokio        = { version = "1",   features = ["full"] }
uuid         = { version = "1",   features = ["v4", "serde"] }
rand         = "0.8"
rand_core    = { version = "0.6", features = ["std"] }
# LAN discovery
socket2      = "0.5"
# TLS for the pairing listener (and cert generation for Postgres SSL)
rcgen        = "0.13"
rustls       = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
sha2         = "0.10"
hex          = "0.4"
base64       = "0.22"
time         = "0.3"
# PDF receipt generation
printpdf     = "0.7"
# WhatsApp Business Cloud API (HTTP client)
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# ── Security foundation (ISO 27001 A.9, A.12.4) ──────────────────────────────
argon2       = "0.5"                      # Password hashing (OWASP-recommended)
ed25519-dalek = { version = "2", features = ["std"] }  # License signature verification

# Hardware fingerprinting — Windows-only (queried via WMI). Gated to the
# windows target so non-Windows builds don't pull in the windows-rs stack.
[target.'cfg(target_os = "windows")'.dependencies]
wmi          = "0.14"

# ── IT-001: Test dependencies ────────────────────────────────────────────────
# These are only compiled for `cargo test` and do NOT ship in production builds.
[dev-dependencies]
# tokio-test — async test helpers (#[tokio::test] macro already in tokio, but
# tokio-test provides additional utilities for testing async code).
tokio-test = "0.4"

# serial_test — ensures tests that share a resource (like the DB) run serially
# rather than in parallel. Used for migration tests that must not overlap.
serial_test = "3"

# rstest — parameterized testing (table-driven tests). Reduces boilerplate for
# the 64-pair compatibility matrix tests and the 12-enum validation tests.
rstest = "0.23"

# sqlx is already a production dependency; here we enable the `migrate` feature
# for test-only migration support (offline mode).
sqlx = { version = "0.8", features = ["migrate"] }

# Note: testcontainers is NOT included — it adds ~50MB of Docker dependency.
# The docker-compose.test.yml approach is simpler and sufficient for our needs.
# If future tests need programmatic container management, add:
#   testcontainers = "0.23"
